<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 인프라 소외지역 분석 지도 - iOS Glassmorphism</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-border-subtle: rgba(255, 255, 255, 0.45);
      --glass-blur: blur(28px) saturate(190%);
      --apple-blue: #007aff;
      --text-main: #1d1d1f;
      --text-sub: #6e6e73;
      --shadow-apple: 0 20px 40px -10px rgba(0, 0, 0, 0.12), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
      --shadow-float: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes auroraGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 15% 15%, #ffd1ff 0%, transparent 40%),
                  radial-gradient(circle at 85% 20%, #c4e0e5 0%, transparent 45%),
                  radial-gradient(circle at 50% 85%, #d4fc79 0%, transparent 40%),
                  #eef2f7;
      background-size: 200% 200%;
      animation: auroraGlow 14s ease infinite;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: stretch;
      -webkit-font-smoothing: antialiased;
    }

    .glass-phone-shell {
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: calc(100vh - 24px);
      min-height: calc(100dvh - 24px);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--shadow-apple);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--glass-border-subtle);
    }

    .brand-ios {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sf-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.4));
      border: 1.5px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand-text h1 {
      font-size: 23px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-sub);
    }

    .search-dock {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 680px;
      flex-wrap: wrap;
    }

    .search-glass-pill {
      position: relative;
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
    }

    .glass-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
      max-height: 240px;
      overflow-y: auto;
      z-index: 2000;
      padding: 6px;
      display: none;
    }

    .autocomplete-item {
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .autocomplete-item:hover { background: rgba(0, 122, 255, 0.1); color: var(--apple-blue); }

    .ios-btn {
      padding: 11px 14px;
      border: none;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.15s ease;
    }
    .ios-btn:hover { transform: scale(1.02); }

    .btn-apple-blue { background: var(--apple-blue); color: #fff; }
    .btn-apple-glass { background: rgba(255, 255, 255, 0.75); color: var(--text-main); border: 1px solid var(--glass-border); }
    .btn-apple-green { background: #34c759; color: #fff; }
    .btn-apple-purple { background: #af52de; color: #fff; }

    /* 카테고리 필터 탭 바 */
    .infra-filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border-subtle);
      border-radius: 20px;
    }

    .filter-tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 30px;
      border: 1.5px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-tab:hover { transform: translateY(-1px); }
    .filter-tab.active { color: #fff; border-color: transparent; transform: translateY(-1px) scale(1.02); background: var(--apple-blue); }

    /* 통계 요약 패널 */
    .stats-summary-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
    }
    .stats-progress-container {
      flex: 1;
      margin: 0 16px;
      background: rgba(0, 0, 0, 0.08);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .stats-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #34c759, #ff9500, #ff3b30);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-dynamic {
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .status-dynamic.success { background: rgba(236, 253, 245, 0.85); color: #065f46; }
    .status-dynamic.fail { background: rgba(254, 242, 242, 0.85); color: #991b1b; }

    .map-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 500px;
      height: calc(100vh - 310px);
      border-radius: 26px;
      overflow: visible;
      border: 1.5px solid var(--glass-border);
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      z-index: 1;
      clip-path: inset(0 round 26px);
    }

    .leaflet-control-container { z-index: 900 !important; }
    .leaflet-top.leaflet-left { top: 65px !important; left: 14px !important; }
    .leaflet-top.leaflet-right { top: 65px !important; right: 14px !important; }

    .leaflet-bar {
      border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
      border-radius: 14px !important;
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(20px) !important;
      overflow: hidden;
    }
    .leaflet-bar a { width: 36px !important; height: 36px !important; line-height: 36px !important; }

    .leaflet-control-layers {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(20px) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
      border-radius: 18px !important;
      padding: 10px 14px !important;
      font-size: 13px !important;
      color: var(--text-main) !important;
    }

    .map-floating-region-bar {
      position: absolute;
      top: 14px; left: 65px; right: 75px;
      z-index: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
    }
    .floating-bar-hint { font-size: 12px; font-weight: 700; color: #4b5563; white-space: nowrap; }

    .pop-custom-div-icon { background: transparent !important; border: none !important; }
    .pop-marker-badge {
      display: inline-flex !important; align-items: center !important; gap: 5px !important;
      background: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(14px) !important;
      border: 2px solid var(--apple-blue); border-radius: 28px !important;
      padding: 6px 14px !important; font-size: 13px !important; font-weight: 800 !important; color: #1d1d1f !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22) !important; cursor: pointer !important;
    }

    @media (max-width: 768px) {
      .map-wrapper { min-height: 420px; height: 55vh; }
      .leaflet-top.leaflet-left { top: 60px !important; left: 8px !important; }
      .leaflet-top.leaflet-right { top: 58px !important; right: 8px !important; }
      .map-floating-region-bar { left: 55px; right: 65px; }
    }
  </style>
</head>
<body>

  <div class="glass-phone-shell" id="captureTargetArea">
    <header class="glass-header">
      <div class="brand-ios">
        <div class="sf-icon">🏥</div>
        <div class="brand-text">
          <h1>대한민국 인프라 소외지역 지도</h1>
          <p>응급의료 · 철도/대중교통 · 문화교육 인프라 취약 지자체 및 읍·면·동 정밀 분석</p>
        </div>
      </div>

      <div class="search-dock">
        <div class="search-glass-pill">
          <input 
            type="text" 
            id="searchInput" 
            class="glass-input" 
            placeholder="시·군·구·읍·면·동 검색 (예: 화도읍, 사북읍, 흑산면)"
            oninput="handleInputAutocomplete(this.value)"
            autocomplete="off"
          />
          <div id="autocompleteList" class="autocomplete-list"></div>
        </div>
        <button class="ios-btn btn-apple-blue" onclick="handleSearch()">검색</button>
        <button class="ios-btn btn-apple-green" onclick="locateMyPosition()">📍 내 위치</button>
        <button class="ios-btn btn-apple-purple" onclick="captureMapScreenshot()">📸 캡처</button>
        <button class="ios-btn btn-apple-glass" onclick="resetMap()">초기화</button>
      </div>
    </header>

    <!-- 카테고리 필터 탭 -->
    <nav class="infra-filter-bar">
      <button class="filter-tab" data-cat="medical"     onclick="filterInfra('medical')">🚨 응급의료</button>
      <button class="filter-tab" data-cat="traffic"     onclick="filterInfra('traffic')">🚆 교통/철도</button>
      <button class="filter-tab" data-cat="education"   onclick="filterInfra('education')">📚 교육</button>
      <button class="filter-tab" data-cat="culture"     onclick="filterInfra('culture')">🎭 문화/체육</button>
      <button class="filter-tab" data-cat="fire"        onclick="filterInfra('fire')">🚒 소방/안전</button>
      <button class="filter-tab" data-cat="welfare"     onclick="filterInfra('welfare')">🏠 복지/돌봄</button>
      <button class="filter-tab" data-cat="digital"     onclick="filterInfra('digital')">📡 통신/디지털</button>
      <button class="filter-tab" data-cat="water"       onclick="filterInfra('water')">💧 상수도/물</button>
      <button class="filter-tab" data-cat="energy"      onclick="filterInfra('energy')">⚡ 에너지/난방</button>
      <button class="filter-tab" data-cat="living"      onclick="filterInfra('living')">🛒 생활/상권</button>
      <button class="filter-tab" data-cat="environment" onclick="filterInfra('environment')">🌲 환경/생태</button>
      <button class="filter-tab" data-cat="job"         onclick="filterInfra('job')">💼 일자리/산업</button>
      <button class="filter-tab" data-cat="danger"      onclick="filterInfra('danger')">📉 소멸위험</button>
    </nav>

    <!-- 통계 요약 패널 -->
    <div id="statsSummaryPanel" class="stats-summary-card" style="display: none;">
      <span id="statsCategoryTitle">📊 선택 카테고리 통계</span>
      <div class="stats-progress-container">
        <div id="statsProgressBar" class="stats-progress-bar"></div>
      </div>
      <span id="statsCategoryDesc" style="font-weight: 700; color: #4b5563;">-</span>
    </div>

    <div id="resultInfo" class="status-dynamic"></div>

    <div class="map-wrapper">
      <div id="map"></div>
      
      <div id="mapFloatingBar" class="map-floating-region-bar">
        <span class="floating-bar-hint">📍 인프라를 선택하면 여기에 해당 지역 바로가기 버튼이 표시됩니다</span>
      </div>
    </div>
  </div>

  <script>
    const allRegions = [
      { name: "경기 수원시", keywords: ["수원", "수원시"], lat: 37.2636, lng: 127.0286, pop: 1192000, desc: "경기 최대 특례시", level: 12 },
      { name: "경기 용인시", keywords: ["용인", "용인시"], lat: 37.2411, lng: 127.1776, pop: 1076000, desc: "반도체 클러스터 특례시", level: 12 },
      { name: "경북 영양군", keywords: ["영양", "영양군"], lat: 36.6666, lng: 129.1125, pop: 15800, desc: "전국 최소 인구 자치군. 24시간 응급의료기관 및 산부인과 부재", level: 12, infraStatus: "심각", medical: "응급실 전무", traffic: "철도/고속도로 없음", score: 96 },
      { name: "전남 신안군", keywords: ["신안", "신안군"], lat: 34.8335, lng: 126.3516, pop: 37900, desc: "1004개의 섬으로 구성되어 응급환자 이송 취약", level: 11, infraStatus: "심각", medical: "도서벽지 의료접근 취약", score: 94 },
      { name: "강원 태백시", keywords: ["태백", "태백시"], lat: 37.1641, lng: 128.9856, pop: 39000, desc: "장성광업소 폐광 이후 일자리 급감 및 필수 의료진 부족", level: 12, infraStatus: "심각", medical: "소아청소년·분만 인프라 붕괴", score: 91 },
      { name: "경북 청송군", keywords: ["청송", "청송군"], lat: 36.4357, lng: 129.0573, pop: 24100, desc: "철도 미경유 산간 오지. 종합병원 접근 시간 1시간 이상", level: 12, infraStatus: "위험", traffic: "철도 미운행", score: 89 },
      { name: "경북 울릉군", keywords: ["울릉", "울릉군"], lat: 37.4845, lng: 130.9059, pop: 9200, desc: "대한민국 유일 도서 군. 영화관·공연장·체육관 전무", level: 12, infraStatus: "심각", culture: "문화시설 전무", score: 95 },
      { name: "인천 옹진군", keywords: ["옹진", "옹진군"], lat: 37.4463, lng: 126.6358, pop: 19800, desc: "해상 응급이송 소요시간 골든타임 초과", level: 11, infraStatus: "심각", fire: "해상 소방 골든타임 초과", score: 93 },
      { name: "전남 완도군", keywords: ["완도", "완도군"], lat: 34.3110, lng: 126.7550, pop: 46800, desc: "도서 가뭄 시 제한급수 상습 발생", level: 11, infraStatus: "심각", water: "도서 가뭄 제한급수 빈발", score: 92 },
      { name: "경남 의령군", keywords: ["의령", "의령군"], lat: 35.3222, lng: 128.2618, pop: 25600, desc: "대형마트 및 24시간 생활편의시설 전무", level: 12, infraStatus: "위험", living: "대형마트·금융점포 부재", score: 85 },
      { name: "경북 울진군", keywords: ["울진", "울진군"], lat: 36.9931, lng: 129.4005, pop: 46700, desc: "동해안 대형산불 고위험 지대", level: 12, infraStatus: "위험", environment: "동해안 대형산불 위험지구", score: 88 },
      // 추가된 읍·면·동 단위 소외지역 데이터
      { name: "전남 신안군 흑산면", keywords: ["흑산면", "흑산", "신안군 흑산면"], lat: 34.6853, lng: 125.4414, pop: 3800, desc: "도서지역 응급환자 발생 시 헬기 이송 의존", level: 13, infraStatus: "심각", medical: "응급실 부재", score: 97 },
      { name: "전남 완도군 보길면", keywords: ["보길면", "보길", "완도군 보길면"], lat: 34.1432, lng: 126.5412, pop: 2700, desc: "상습 가뭄 지역 및 식수 공급 제한", level: 13, infraStatus: "심각", water: "제한급수 지역", score: 93 },
      { name: "강원 정선군 사북읍", keywords: ["사북읍", "사북", "정선군 사북읍"], lat: 37.2025, lng: 128.8164, pop: 4400, desc: "폐광 지역 이후 대체 산업 및 생활 인프라 부족", level: 13, infraStatus: "위험", job: "폐광지역 일자리 취약", score: 87 },
      { name: "강원 정선군 고한읍", keywords: ["고한읍", "고한", "정선군 고한읍"], lat: 37.1869, lng: 128.8475, pop: 4100, desc: "고산지대 교통 및 의료 접근성 취약", level: 13, infraStatus: "위험", medical: "의료기관 부족", score: 86 },
      { name: "경북 울릉군 울릉읍", keywords: ["울릉읍", "울릉읍(도동/남양)", "울릉군 울릉읍"], lat: 37.4845, lng: 130.9059, pop: 6100, desc: "울릉도 중심지이나 육지 연결 교통망 기상 영향 큼", level: 13, infraStatus: "심각", traffic: "해상교통 의존", score: 94 },
      { name: "제주 제주시 추자면", keywords: ["추자면", "추자", "제주시 추자면"], lat: 33.9553, lng: 126.3297, pop: 1600, desc: "제주 본섬과 전남 사이 도서 오지 지역", level: 13, infraStatus: "심각", medical: "응급의료 취약", score: 95 }
    ];

    const koreaBounds = L.latLngBounds([33.0, 124.5], [38.7, 131.9]);

    const map = L.map('map', {
      center: [35.9, 127.8],
      zoom: 7,
      minZoom: 6.8,
      maxZoom: 20,
      zoomControl: true,
      maxBounds: koreaBounds,
      maxBoundsViscosity: 1.0
    });

    map.fitBounds(koreaBounds);

    const googleSatLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      subdomains: '0123', maxZoom: 20, attribution: '&copy; Google Maps'
    }).addTo(map);

    const esriSatLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: '&copy; Esri'
    });

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    });

    L.control.layers({
      "🛰️ 구글 위성 지도": googleSatLayer,
      "🌍 ESRI 세계 위성 지도": esriSatLayer,
      "🗺️ 일반 도로 지도": osmLayer
    }, null, { position: 'topright' }).addTo(map);

    let searchMarker = null;

    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      closeAutocomplete();
      if (!query) {
        showResult('검색어를 입력해주세요.', false);
        return;
      }

      if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

      const found = allRegions.find(item => 
        item.name.toLowerCase().includes(query) || 
        item.keywords.some(k => k.toLowerCase().includes(query) || query.includes(k.toLowerCase()))
      );

      if (found) {
        map.flyTo([found.lat, found.lng], found.level, { duration: 1.2 });
        const shortName = found.name.split(" ").slice(-1)[0];
        const badgeHtml = `<div class="pop-marker-badge"><span>📍 ${shortName}</span></div>`;
        const customIcon = L.divIcon({ className: 'pop-custom-div-icon', html: badgeHtml, iconSize: [0, 0] });
        searchMarker = L.marker([found.lat, found.lng], { icon: customIcon }).addTo(map);
        searchMarker.bindPopup(`<div class="pop-card"><h3>📍 ${found.name}</h3><p class="desc">${found.desc}</p></div>`).openPopup();
        showResult(`📍 <b>${found.name}</b> [인구수: <b>${found.pop.toLocaleString()} 명</b>]`, true);
      } else {
        showResult(`❌ <b>'${query}'</b> 검색 결과를 찾을 수 없습니다.`, false);
      }
    }

    function locateMyPosition() {
      if (!navigator.geolocation) {
        showResult('이 브라우저에서는 위치 정보(GPS)를 지원하지 않습니다.', false);
        return;
      }
      showResult('📍 현재 위치를 탐색 중입니다...', true);
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          map.flyTo([lat, lng], 14, { duration: 1.5 });
          if (searchMarker) map.removeLayer(searchMarker);
          const badgeHtml = `<div class="pop-marker-badge" style="border-color: #34c759;"><span>📍 내 위치</span></div>`;
          const customIcon = L.divIcon({ className: 'pop-custom-div-icon', html: badgeHtml, iconSize: [0, 0] });
          searchMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
          searchMarker.bindPopup(`<div class="pop-card"><h3>📍 현재 위치</h3><p class="desc">위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)}</p></div>`).openPopup();
          showResult('📍 현재 위치로 이동했습니다.', true);
        },
        (error) => {
          showResult('❌ 위치 정보를 가져오지 못했습니다. (위치 권한을 확인해주세요)', false);
        },
        { timeout: 10000 }
      );
    }

    function captureMapScreenshot() {
      showResult('📸 화면을 캡처하는 중입니다...', true);
      const targetArea = document.getElementById('captureTargetArea');
      html2canvas(targetArea, { useCORS: true, scale: 1.5 }).then(canvas => {
        const link = document.createElement('a');
        link.download = '인프라소외지역분석지도.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showResult('✅ 화면 캡처가 완료되어 이미지로 저장되었습니다!', true);
      }).catch(err => {
        showResult('❌ 화면 캡처 중 오류가 발생했습니다.', false);
      });
    }

    function resetMap() {
      document.getElementById('searchInput').value = '';
      closeAutocomplete();
      document.getElementById('resultInfo').style.display = 'none';
      document.getElementById('statsSummaryPanel').style.display = 'none';
      if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
      if (infraMarkers) infraMarkers.clearLayers();
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      map.fitBounds(koreaBounds, { animate: true, duration: 1.0 });
    }

    function showResult(html, isSuccess) {
      const box = document.getElementById('resultInfo');
      box.style.display = 'block';
      box.className = 'status-dynamic ' + (isSuccess ? 'success' : 'fail');
      box.innerHTML = html;
    }

    let infraMarkers = L.layerGroup().addTo(map);
    const catFieldMap = {
      medical: 'medical', traffic: 'traffic', education: 'education',
      culture: 'culture', fire: 'fire', welfare: 'welfare',
      digital: 'digital', water: 'water', energy: 'energy',
      living: 'living', environment: 'environment', job: 'job',
      danger: 'infraStatus'
    };

    function filterInfra(cat) {
      const tabs = document.querySelectorAll('.filter-tab');
      const clickedTab = document.querySelector(`.filter-tab[data-cat="${cat}"]`);
      const isOpen = clickedTab.classList.contains('active');

      tabs.forEach(t => t.classList.remove('active'));
      infraMarkers.clearLayers();
      if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

      if (isOpen) {
        document.getElementById('statsSummaryPanel').style.display = 'none';
        map.fitBounds(koreaBounds, { animate: true, duration: 0.8 });
        showResult('', false);
        document.getElementById('resultInfo').style.display = 'none';
        return;
      }

      clickedTab.classList.add('active');

      const field = catFieldMap[cat];
      const matched = allRegions.filter(r => {
        if (cat === 'danger') return r.infraStatus === '심각' || r.infraStatus === '위험';
        return r[field] && r.infraStatus;
      });

      const statsPanel = document.getElementById('statsSummaryPanel');
      const progressBar = document.getElementById('statsProgressBar');
      const descEl = document.getElementById('statsCategoryDesc');
      const titleEl = document.getElementById('statsCategoryTitle');

      const catNames = {
        medical: '응급의료', traffic: '교통/철도', education: '교육',
        culture: '문화/체육', fire: '소방/안전', welfare: '복지/돌봄',
        digital: '통신/디지털', water: '상수도/수자원', energy: '에너지/난방',
        living: '생활/상권', environment: '환경/생태', job: '일자리/산업',
        danger: '소멸위험'
      };

      statsPanel.style.display = 'flex';
      titleEl.innerHTML = `📊 ${catNames[cat]} 취약 지역 (${matched.length}곳)`;
      const avgScore = matched.length > 0 ? Math.round(matched.reduce((acc, cur) => acc + (cur.score || 85), 0) / matched.length) : 0;
      progressBar.style.width = `${avgScore}%`;
      descEl.innerHTML = `평균 취약점수: <b>${avgScore}점</b>`;

      const bounds = [];
      matched.forEach(r => {
        const shortName = r.name.split(" ").slice(-1)[0];
        const badgeHtml = `<div class="pop-marker-badge"><span>📍 ${shortName}</span></div>`;
        const icon = L.divIcon({ className: 'pop-custom-div-icon', html: badgeHtml, iconSize: [0, 0] });
        const marker = L.marker([r.lat, r.lng], { icon }).addTo(infraMarkers);
        marker.bindPopup(`<div class="pop-card"><h3>📍 ${r.name}</h3><p class="desc">${r.desc}</p></div>`);
        bounds.push([r.lat, r.lng]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], animate: true, duration: 1.0 });
      }
    }

    function handleInputAutocomplete(val) {
      const listEl = document.getElementById('autocompleteList');
      const query = val.trim().toLowerCase();
      if (!query) { listEl.style.display = 'none'; return; }
      
      const matches = allRegions.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.keywords.some(k => k.toLowerCase().includes(query))
      ).slice(0, 5);

      if (matches.length === 0) { listEl.style.display = 'none'; return; }
      
      listEl.innerHTML = matches.map(m => `
        <div class="autocomplete-item" onclick="selectAutocomplete('${m.name}')">📍 ${m.name}</div>
      `).join('');
      listEl.style.display = 'block';
    }

    function selectAutocomplete(name) {
      document.getElementById('searchInput').value = name;
      closeAutocomplete();
      handleSearch();
    }

    function closeAutocomplete() {
      const listEl = document.getElementById('autocompleteList');
      if (listEl) listEl.style.display = 'none';
    }

    window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
