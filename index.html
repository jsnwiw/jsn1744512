<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 인프라 소외지역 분석 지도 - iOS Glassmorphism</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-border-subtle: rgba(255, 255, 255, 0.45);
      --glass-blur: blur(28px) saturate(190%);
      --apple-blue: #007aff;
      --text-main: #1d1d1f;
      --text-sub: #6e6e73;
      --shadow-apple: 0 20px 40px -10px rgba(0, 0, 0, 0.12), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
      --shadow-float: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes auroraGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 15% 15%, #ffd1ff 0%, transparent 40%),
                  radial-gradient(circle at 85% 20%, #c4e0e5 0%, transparent 45%),
                  radial-gradient(circle at 50% 85%, #d4fc79 0%, transparent 40%),
                  #eef2f7;
      background-size: 200% 200%;
      animation: auroraGlow 14s ease infinite;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: stretch;
      -webkit-font-smoothing: antialiased;
    }

    .glass-phone-shell {
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: calc(100vh - 24px);
      min-height: calc(100dvh - 24px);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--shadow-apple);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--glass-border-subtle);
    }

    .brand-ios {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sf-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.4));
      border: 1.5px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand-text h1 {
      font-size: 23px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-sub);
    }

    .search-dock {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 680px;
      flex-wrap: wrap;
    }

    .search-glass-pill {
      position: relative;
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
    }

    .glass-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
      max-height: 240px;
      overflow-y: auto;
      z-index: 2000;
      padding: 6px;
      display: none;
    }

    .autocomplete-item {
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .autocomplete-item:hover { background: rgba(0, 122, 255, 0.1); color: var(--apple-blue); }

    .ios-btn {
      padding: 11px 14px;
      border: none;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.15s ease;
    }
    .ios-btn:hover { transform: scale(1.02); }

    .btn-apple-blue { background: var(--apple-blue); color: #fff; }
    .btn-apple-glass { background: rgba(255, 255, 255, 0.75); color: var(--text-main); border: 1px solid var(--glass-border); }
    .btn-apple-green { background: #34c759; color: #fff; }
    .btn-apple-purple { background: #af52de; color: #fff; }

    /* 카테고리 필터 탭 바 */
    .infra-filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border-subtle);
      border-radius: 20px;
    }

    .filter-tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 30px;
      border: 1.5px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-tab:hover { transform: translateY(-1px); }
    .filter-tab.active { color: #fff; border-color: transparent; transform: translateY(-1px) scale(1.02); background: var(--apple-blue); }

    /* 통계 요약 패널 */
    .stats-summary-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
    }
    .stats-progress-container {
      flex: 1;
      margin: 0 16px;
      background: rgba(0, 0, 0, 0.08);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .stats-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #34c759, #ff9500, #ff3b30);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-dynamic {
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .status-dynamic.success { background: rgba(236, 253, 245, 0.85); color: #065f46; }
    .status-dynamic.fail { background: rgba(254, 242, 242, 0.85); color: #991b1b; }

    .map-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 500px;
      height: calc(100vh - 310px);
      border-radius: 26px;
      overflow: visible;
      border: 1.5px solid var(--glass-border);
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      z-index: 1;
      clip-path: inset(0 round 26px);
    }

    .leaflet-control-container { z-index: 900 !important; }
    .leaflet-top.leaflet-left { top: 65px !important; left: 14px !important; }
    .leaflet-top.leaflet-right { top: 65px !important; right: 14px !important; }

    .leaflet-bar {
      border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
      border-radius: 14px !important;
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(20px) !important;
      overflow: hidden;
    }
    .leaflet-bar a { width: 36px !important; height: 36px !important; line-height: 36px !important; }

    .leaflet-control-layers {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(20px) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
      border-radius: 18px !important;
      padding: 10px 14px !important;
      font-size: 13px !important;
      color: var(--text-main) !important;
    }

    .map-floating-region-bar {
      position: absolute;
      top: 14px; left: 65px; right: 75px;
      z-index: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
    }
    .floating-bar-hint { font-size: 12px; font-weight: 700; color: #4b5563; white-space: nowrap; }

    .pop-custom-div-icon { background: transparent !important; border: none !important; }
    .pop-marker-badge {
      display: inline-flex !important; align-items: center !important; gap: 5px !important;
      background: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(14px) !important;
      border: 2px solid var(--apple-blue); border-radius: 28px !important;
      padding: 6px 14px !important; font-size: 13px !important; font-weight: 800 !important; color: #1d1d1f !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22) !important; cursor: pointer !important;
    }

    @media (max-width: 768px) {
      .map-wrapper { min-height: 420px; height: 55vh; }
      .leaflet-top.leaflet-left { top: 60px !important; left: 8px !important; }
      .leaflet-top.leaflet-right { top: 58px !important; right: 8px !important; }
      .map-floating-region-bar { left: 55px; right: 65px; }
    }
  </style>
</head>
<body>

  <div class="glass-phone-shell" id="captureTargetArea">
    <header class="glass-header">
      <div class="brand-ios">
        <div class="sf-icon">🏥</div>
        <div class="brand-text">
          <h1>대한민국 인프라 소외지역 지도</h1>
          <p>응급의료 · 철도/대중교통 · 문화교육 인프라 취약 지자체 및 읍·면·동 정밀 분석</p>
        </div>
      </div>

      <div class="search-dock">
        <div class="search-glass-pill">

            type="text" 
            id="searchInput"

            placeholder="시·군·구·읍·면·동 검색 (예: 화도읍, 사북읍, 흑산면)"

            autocomplete="off"
          />
          <div id="autocompleteList" class="autocomplete-list"></div>
        </div>
        <button class="ios-btn btn-apple-blue" onclick="handleSearch()">검색</button>

        <button class="ios-btn btn-apple-purple" onclick="captureMapScreenshot()">📸 캡처</button>

      <button class="filter-tab" data-cat="education"   onclick="filterInfra('education')">📚 교육</button>
      <button class="filter-tab" data-cat="culture"     onclick="filterInfra('culture')">🎭 문화/체육</button>
      <button class="filter-tab" data-cat="fire"        onclick="filterInfra('fire')">🚒 소방/안전</button>
      <button class="filter-tab" data-cat="welfare"     onclick="filterInfra('welfare')">🏠 복지/돌봄</button>
      <button class="filter-tab" data-cat="digital"     onclick="filterInfra('digital')">📡 통신/디지털</button>
      <button class="filter-tab" data-cat="water"       onclick="filterInfra('water')">💧 상수도/물</button>
      <button class="filter-tab" data-cat="energy"      onclick="filterInfra('energy')">⚡ 에너지/난방</button>
      <button class="filter-tab" data-cat="living"      onclick="filterInfra('living')">🛒 생활/상권</button>

      <div class="stats-progress-container">
        <div id="statsProgressBar" class="stats-progress-bar"></div>
      </div>
      <span id="statsCategoryDesc" style="font-weight: 700; color: #4b5563;">-</span>

      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.4s ease;
      align-self: flex-start;
    ">⏳ 인구수 데이터 로딩 중...</div>

    <div class="map-wrapper">
      <div id="map"></div>
      
      <div id="mapFloatingBar" class="map-floating-region-bar">
        <span class="floating-bar-hint">📍 인프라를 선택하면 여기에 해당 지역 바로가기 버튼이 표시됩니다</span>
      </div>
    </div>
  </div>

    async function fetchRealTimePopulation() {
      // 1. localStorage 24시간 캐시 체크
      try {
        const cached = localStorage.getItem('kr_pop_wikidata_v2');
        if (cached) {
          const { data, ts } = JSON.parse(cached);
          if (Date.now() - ts < 86400000) { // 24시간
            applyPopulationData(data);
            const d = new Date(ts);
            showPopBadge('캐시', `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 기준`);
            return;
          }
        }
      } catch(e) {}

      // 2. Wikidata SPARQL 배치 쿼리 (단 1번 요청으로 전체 처리)
      const qids = Object.values(wikidataQidMap).map(q => `wd:${q}`).join(' ');
      const sparql = `
        SELECT ?item ?population WHERE {
          VALUES ?item { ${qids} }
          ?item wdt:P1082 ?population.
        }
      `;

      try {
        showPopBadge('loading', '');
        const resp = await fetch(
          `https://query.wikidata.org/sparql?query=${encodeURIComponent(sparql)}&format=json`,
          {
            headers: {
              'Accept': 'application/sparql-results+json',
              'User-Agent': 'KoreaInfraMap/2.0 (educational project)'
            }
          }
        );

        if (!resp.ok) throw new Error('API 응답 오류');
        const json = await resp.json();

        // QID → 키워드 역매핑
        const reverseMap = {};
        for (const [kw, qid] of Object.entries(wikidataQidMap)) {
          reverseMap[`http://www.wikidata.org/entity/${qid}`] = kw;
        }

        // 결과 파싱 (동일 QID 여러 인구수 → 가장 큰 값 사용)
        const popData = {};
        for (const row of json.results.bindings) {
          const uri = row.item.value;
          const kw = reverseMap[uri];
          if (!kw) continue;
          const p = parseInt(row.population.value, 10);
          if (!popData[kw] || p > popData[kw]) popData[kw] = p;
        }

        // 캐시 저장
        localStorage.setItem('kr_pop_wikidata_v2', JSON.stringify({ data: popData, ts: Date.now() }));

        applyPopulationData(popData);
        const now = new Date();
        showPopBadge('실시간', `${now.getFullYear()}년 ${now.getMonth()+1}월 실시간`);

      } catch (err) {
        console.warn('[인구통계] Wikidata API 실패, 내부 DB 사용:', err);
        showPopBadge('내부DB', '2024~2025 주민등록통계');
      }
    }

    function applyPopulationData(popData) {
      // allRegions의 pop 값 실시간 업데이트
      allRegions.forEach(region => {
        for (const [kw, pop] of Object.entries(popData)) {
          if (pop > 1000 && (
            region.keywords.some(k => k === kw || k.includes(kw) || kw.includes(k)) ||
            region.name.includes(kw)
          )) {
            region.pop = pop;
            break;
          }
        }
      });
      // districtPopDb도 실시간 업데이트
      for (const [kw, pop] of Object.entries(popData)) {
        if (districtPopDb.hasOwnProperty(kw) && pop > 1000) {
          districtPopDb[kw] = pop;
        }
      }
    }
