<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 인프라 소외지역 분석 지도 - iOS Glassmorphism</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glass-phone-shell">
    <header class="glass-header">
      <div class="brand-ios">
        <div class="sf-icon">🏥</div>
        <div class="brand-text">
          <h1>대한민국 인프라 소외지역 지도</h1>
          <p>응급의료 · 철도/대중교통 · 문화교육 인프라 취약 지자체 정밀 분석</p>
        </div>
      </div>

      <div class="search-dock">
        <div class="search-glass-pill">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            class="glass-input" 
            placeholder="지역명 검색 (예: 영양군, 신안군, 태백시, 의성군, 정선군)"
            oninput="handleInputAutocomplete(this.value)"
            onkeydown="handleKeyNavigation(event)"
            onfocus="handleInputAutocomplete(this.value)"
            autocomplete="off"
            autofocus
          />
          <div id="autocompleteList" class="autocomplete-list"></div>
        </div>
        <button class="ios-btn btn-apple-blue" onclick="handleSearch()">검색</button>
        <button class="ios-btn btn-apple-glass" onclick="resetMap()">전국 초기화</button>
      </div>
    </header>

    <!-- 인프라 카테고리 필터 탭 (13대 인프라 정밀 분석) -->
    <nav class="infra-filter-bar">
      <button class="filter-tab" data-cat="medical"     onclick="filterInfra('medical')">🚨 응급의료</button>
      <button class="filter-tab" data-cat="traffic"     onclick="filterInfra('traffic')">🚆 교통/철도</button>
      <button class="filter-tab" data-cat="education"   onclick="filterInfra('education')">📚 교육</button>
      <button class="filter-tab" data-cat="culture"     onclick="filterInfra('culture')">🎭 문화/체육</button>
      <button class="filter-tab" data-cat="fire"        onclick="filterInfra('fire')">🚒 소방/안전</button>
      <button class="filter-tab" data-cat="welfare"     onclick="filterInfra('welfare')">🏠 복지/돌봄</button>
      <button class="filter-tab" data-cat="digital"     onclick="filterInfra('digital')">📡 통신/디지털</button>
      <button class="filter-tab" data-cat="water"       onclick="filterInfra('water')">💧 상수도/물</button>
      <button class="filter-tab" data-cat="energy"      onclick="filterInfra('energy')">⚡ 에너지/난방</button>
      <button class="filter-tab" data-cat="living"      onclick="filterInfra('living')">🛒 생활/상권</button>
      <button class="filter-tab" data-cat="environment" onclick="filterInfra('environment')">🌲 환경/생태</button>
      <button class="filter-tab" data-cat="job"         onclick="filterInfra('job')">💼 일자리/산업</button>
      <button class="filter-tab" data-cat="danger"      onclick="filterInfra('danger')">📉 소멸위험</button>
    </nav>

    <!-- 카테고리별 패널 -->
    <div class="infra-panel" id="panel-medical">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#dc2626;">🚨 응급의료 소외 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('영양군')">경북 영양군 (응급의료원 부재)</button>
        <button class="ios-chip alert" onclick="quickSearch('신안군')">전남 신안군 (도서 응급이송 취약)</button>
        <button class="ios-chip alert" onclick="quickSearch('태백시')">강원 태백시 (필수의료 붕괴 위기)</button>
        <button class="ios-chip alert" onclick="quickSearch('구례군')">전남 구례군 (분만·소아과 부재)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-traffic">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#ea580c;">🚆 교통/철도 소외 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('청송군')">경북 청송군 (고속철도/국도 소외)</button>
        <button class="ios-chip alert" onclick="quickSearch('양구군')">강원 양구군 (산간 접경 오지)</button>
        <button class="ios-chip alert" onclick="quickSearch('무주군')">전북 무주군 (내륙 산간 교통취약)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-education">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#4338ca;">📚 교육 소외 지자체</span>
        <button class="ios-chip" onclick="quickSearch('임실군')">전북 임실군 (고교 1개교)</button>
        <button class="ios-chip" onclick="quickSearch('장수군')">전북 장수군 (학원 전무)</button>
        <button class="ios-chip" onclick="quickSearch('봉화군')">경북 봉화군 (대학교 전무)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-culture">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#7c3aed;">🎭 문화/체육 소외 지자체</span>
        <button class="ios-chip" onclick="quickSearch('울릉군')">경북 울릉군 (문화시설 전무)</button>
        <button class="ios-chip" onclick="quickSearch('영덕군')">경북 영덕군 (공연장 부재)</button>
        <button class="ios-chip" onclick="quickSearch('진안군')">전북 진안군 (체육관 부재)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-fire">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#c2410c;">🚒 소방/안전 소외 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('옹진군')">인천 옹진군 (도서지역 골든타임 초과)</button>
        <button class="ios-chip alert" onclick="quickSearch('횡성군')">강원 횡성군 (소방서 원거리)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-welfare">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#0f766e;">🏠 복지/돌봄 소외 지자체</span>
        <button class="ios-chip" onclick="quickSearch('군위군')">대구 군위군 (노인돌봄 인력부족)</button>
        <button class="ios-chip" onclick="quickSearch('함양군')">경남 함양군 (어린이집 감소)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-digital">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#0e7490;">📡 통신/디지털 소외 지자체</span>
        <button class="ios-chip" onclick="quickSearch('영월군')">강원 영월군 (5G 음영지역)</button>
        <button class="ios-chip alert" onclick="quickSearch('화순군')">전남 화순군 (디지털 접근성 취약)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-water">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#0284c7;">💧 상수도/수자원 취약 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('완도군')">전남 완도군 (도서 가뭄 제한급수 취약)</button>
        <button class="ios-chip alert" onclick="quickSearch('진도군')">전남 진도군 (소규모 수도시설 의존)</button>
        <button class="ios-chip" onclick="quickSearch('신안군')">전남 신안군 (식수원 부족 도서)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-energy">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#a16207;">⚡ 에너지/도시가스 소외 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('영양군')">경북 영양군 (도시가스 미공급·LPG배관)</button>
        <button class="ios-chip alert" onclick="quickSearch('청송군')">경북 청송군 (도시가스 보급률 최하위)</button>
        <button class="ios-chip" onclick="quickSearch('인제군')">강원 인제군 (혹한기 난방취약)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-living">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#0f766e;">🛒 생활·필수편의상권 소외 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('의령군')">경남 의령군 (대형마트·외식상권 부재)</button>
        <button class="ios-chip alert" onclick="quickSearch('산청군')">경남 산청군 (생필품 접근거리 원거리)</button>
        <button class="ios-chip" onclick="quickSearch('곡성군')">전남 곡성군 (금융·상업점포 감소)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-environment">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#15803d;">🌲 환경·재해대응 취약 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('울진군')">경북 울진군 (동해안 대형산불 위험지구)</button>
        <button class="ios-chip alert" onclick="quickSearch('삼척시')">강원 삼척시 (산불·침수 복합 취약)</button>
        <button class="ios-chip" onclick="quickSearch('합천군')">경남 합천군 (하천 범람·자연재해 취약)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-job">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#334155;">💼 청년일자리·산업기반 소외 지자체</span>
        <button class="ios-chip alert" onclick="quickSearch('태백시')">강원 태백시 (석탄공사 폐광 일자리 위기)</button>
        <button class="ios-chip alert" onclick="quickSearch('보성군')">전남 보성군 (1차 농어업 편중·제조업 전무)</button>
        <button class="ios-chip" onclick="quickSearch('영천시')">경북 영천시 (청년 일자리 유출)</button>
      </div>
    </div>

    <div class="infra-panel" id="panel-danger">
      <div class="infra-chip-group">
        <span class="chip-label" style="color:#4b5563;">📉 소멸위험 복합지역</span>
        <button class="ios-chip" onclick="quickSearch('의성군')">경북 의성군</button>
        <button class="ios-chip" onclick="quickSearch('정선군')">강원 정선군</button>
        <button class="ios-chip" onclick="quickSearch('고흥군')">전남 고흥군</button>
        <button class="ios-chip" onclick="quickSearch('남원시')">전북 남원시</button>
      </div>
    </div>

    <div id="resultInfo" class="status-dynamic"></div>

    <div class="map-wrapper">
      <div id="map"></div>
      <div id="mapFlashEffect" class="map-layer-flash"></div>
      <div id="layerToast" class="layer-switch-toast">
        <span class="toast-indicator"></span>
        <span id="layerToastText">지도 레이어 전환 중...</span>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
